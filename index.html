<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BurgerAR</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas { width: 100%; height: 100%; display: block; }
        
        #ar-btn {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f); color: white;
            border: none; padding: 18px 32px; border-radius: 30px; font-size: 17px;
            font-weight: 600; cursor: pointer; z-index: 100; box-shadow: 0 8px 25px rgba(238,90,111,0.4);
        }
        
        #scanner, #cursor {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            pointer-events: none; display: none; z-index: 9999;
        }
        
        #scanner { width: 140px; height: 140px; }
        #scanner.active { display: block; }
        #scanner .ring {
            position: absolute; width: 100%; height: 100%; border: 4px solid #0f0;
            border-radius: 50%; animation: pulse 1s infinite;
            box-shadow: 0 0 40px rgba(0,255,0,0.6);
        }
        
        #cursor { width: 100px; height: 100px; }
        #cursor.active { display: block; }
        #cursor .ring {
            position: absolute; width: 100%; height: 100%; border: 4px solid #f00;
            border-radius: 50%; animation: pulse 0.8s infinite;
            box-shadow: 0 0 30px rgba(255,0,0,0.8);
        }
        #cursor .dot {
            position: absolute; width: 16px; height: 16px; background: #f00;
            border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255,0,0,1);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        #prompt {
            position: fixed; left: 50%; top: 15%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 20px 30px; border-radius: 15px;
            text-align: center; display: none; z-index: 9998; border: 3px solid #ff6b6b;
            min-width: 280px;
        }
        #prompt.scan { border-color: #0f0; display: block; }
        #prompt.place { border-color: #f00; display: block; }
        #prompt p { color: white; font-size: 18px; font-weight: 600; margin: 0; }
        #prompt .sub { color: #aaa; font-size: 14px; margin-top: 8px; }
        
        #instructions {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; align-items: center;
            justify-content: center; z-index: 100000;
        }
        .instr-box {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1e);
            border: 3px solid #ff6b6b; border-radius: 20px; padding: 30px;
            max-width: 350px; text-align: center;
        }
        .instr-box h2 { color: #ff6b6b; margin-bottom: 20px; }
        .step { display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
            color: white; font-size: 15px; text-align: left; }
        .step-num { width: 28px; height: 28px; background: #ff6b6b; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; flex-shrink: 0; }
        #start-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f); color: white;
            border: none; padding: 14px 32px; border-radius: 25px; font-size: 16px;
            font-weight: 600; cursor: pointer; margin-top: 15px;
        }
        
        #debug {
            position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.9);
            color: #0f0; padding: 8px; border-radius: 4px; font-family: monospace;
            font-size: 10px; max-width: 300px; z-index: 100001; max-height: 150px;
            overflow-y: auto;
        }
        
        #loading {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 18px; display: none; z-index: 1000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="loading">Загрузка...</div>
    
    <button id="ar-btn">📱 Включить AR</button>
    
    <div id="scanner"><div class="ring"></div></div>
    <div id="cursor"><div class="ring"></div><div class="dot"></div></div>
    
    <div id="prompt">
        <p id="p-title">Сканирование</p>
        <p class="sub" id="p-sub">Двойной тап чтобы зафиксировать</p>
    </div>
    
    <div id="instructions">
        <div class="instr-box">
            <h2>📱 Как использовать AR</h2>
            <div class="step"><span class="step-num">1</span><span>Нажмите кнопку AR</span></div>
            <div class="step"><span class="step-num">2</span><span>Наведите на стол/пол</span></div>
            <div class="step"><span class="step-num">3</span><span>Двойной тап → сканирование</span></div>
            <div class="step"><span class="step-num">4</span><span>Еще раз → бургер!</span></div>
            <button id="start-btn">Понятно!</button>
        </div>
    </div>
    
    <div id="debug"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const arBtn = document.getElementById('ar-btn');
        const scanner = document.getElementById('scanner');
        const cursor = document.getElementById('cursor');
        const prompt = document.getElementById('prompt');
        const pTitle = document.getElementById('p-title');
        const pSub = document.getElementById('p-sub');
        const instructions = document.getElementById('instructions');
        const startBtn = document.getElementById('start-btn');
        const debug = document.getElementById('debug');
        const loading = document.getElementById('loading');
        
        let scene, camera, renderer, burger, reticle;
        let xrSession, xrRefSpace, hitTestSource;
        let arActive = false, surfaceFound = false, modelPlaced = false, lastTap = 0;
        
        function log(msg) {
            console.log(msg);
            debug.innerHTML += msg + '<br>';
            debug.scrollTop = debug.scrollHeight;
        }
        
        // Инициализация
        function init() {
            log('🚀 Инициализация...');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
            
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            
            // Освещение
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(5, 10, 7);
            scene.add(dir);
            
            // Reticle
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.08, 0.1, 32),
                new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
            );
            reticle.rotation.x = -Math.PI/2;
            reticle.visible = false;
            scene.add(reticle);
            
            // Загрузка модели с DRACO
            loadModel();
            
            window.addEventListener('resize', onResize);
            arBtn.addEventListener('click', startAR);
            startBtn.addEventListener('click', () => {
                instructions.style.display = 'none';
                startAR();
            });
            
            animate();
        }
        
        function loadModel() {
            log('📦 Загрузка модели...');
            loading.style.display = 'block';
            
            const loader = new THREE.GLTFLoader();
            const draco = new THREE.DRACOLoader();
            draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
            loader.setDRACOLoader(draco);
            
            loader.load('Hamburger2.glb',
                (gltf) => {
                    log('✅ Модель загружена');
                    burger = gltf.scene;
                    burger.scale.set(8, 8, 8);
                    burger.visible = false;
                    scene.add(burger);
                    loading.style.display = 'none';
                },
                (progress) => {
                    if (progress.total > 0) {
                        const pct = (progress.loaded / progress.total * 100).toFixed(0);
                        log('📦 ' + pct + '%');
                    }
                },
                (err) => {
                    log('❌ Ошибка: ' + err.message);
                    loading.innerHTML = 'Ошибка загрузки';
                }
            );
        }
        
        async function startAR() {
            log('📱 Запуск AR...');
            
            if (!navigator.xr) {
                log('❌ WebXR не поддерживается');
                return;
            }
            
            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!supported) {
                    log('❌ AR не поддерживается');
                    return;
                }
                
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test']
                });
                
                log('✅ Сессия создана');
                arActive = true;
                surfaceFound = false;
                modelPlaced = false;
                
                // ВАЖНО: Делаем контекст XR compatible
                const gl = renderer.getContext();
                await gl.makeXRCompatible();
                log('✅ WebGL XR compatible');
                
                // Создаем слой
                const baseLayer = new XRWebGLLayer(xrSession, gl);
                xrSession.updateRenderState({ baseLayer });
                
                xrRefSpace = await xrSession.requestReferenceSpace('local');
                const viewerSpace = await xrSession.requestReferenceSpace('viewer');
                hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
                
                xrSession.addEventListener('end', onAREnd);
                
                // DOM события для тачей
                canvas.addEventListener('touchstart', onTouch, { passive: false });
                canvas.addEventListener('click', onTouch);
                
                renderer.xr.setSession(xrSession);
                
                showScanUI();
                
            } catch (e) {
                log('❌ Ошибка AR: ' + e.message);
            }
        }
        
        function showScanUI() {
            scanner.classList.add('active');
            prompt.classList.add('scan');
            prompt.classList.remove('place');
            pTitle.textContent = '🔍 Сканирование';
            pSub.textContent = 'Двойной тап чтобы зафиксировать';
        }
        
        function showPlaceUI() {
            scanner.classList.remove('active');
            cursor.classList.add('active');
            prompt.classList.remove('scan');
            prompt.classList.add('place');
            pTitle.textContent = '🍔 Готово!';
            pSub.textContent = 'Двойной тап чтобы разместить';
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
        
        function placeBurger() {
            if (!burger || !reticle.visible) return;
            
            modelPlaced = true;
            burger.position.copy(reticle.position);
            burger.rotation.copy(reticle.rotation);
            burger.visible = true;
            
            scanner.classList.remove('active');
            cursor.classList.remove('active');
            prompt.style.display = 'none';
            
            log('🍔 Бургер размещен!');
            if (navigator.vibrate) navigator.vibrate(50);
        }
        
        function onTouch(e) {
            if (!arActive) return;
            if (e.type === 'touchstart') e.preventDefault();
            
            const now = Date.now();
            const diff = now - lastTap;
            
            if (diff < 300 && diff > 0) {
                log('👆👆 Двойной тап');
                if (!surfaceFound) {
                    surfaceFound = true;
                    showPlaceUI();
                } else if (!modelPlaced) {
                    placeBurger();
                }
                lastTap = 0;
            } else {
                lastTap = now;
            }
        }
        
        function onAREnd() {
            log('👋 AR завершен');
            arActive = false;
            surfaceFound = false;
            modelPlaced = false;
            
            canvas.removeEventListener('touchstart', onTouch);
            canvas.removeEventListener('click', onTouch);
            
            scanner.classList.remove('active');
            cursor.classList.remove('active');
            prompt.style.display = 'none';
            prompt.classList.remove('scan', 'place');
            
            if (burger) burger.visible = false;
            
            xrSession = null;
            hitTestSource = null;
        }
        
        function animate() {
            renderer.setAnimationLoop((time, frame) => {
                if (frame && arActive && hitTestSource) {
                    const hits = frame.getHitTestResults(hitTestSource);
                    if (hits.length > 0) {
                        const pose = hits[0].getPose(xrRefSpace);
                        reticle.visible = true;
                        reticle.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
                        reticle.rotation.setFromQuaternion(new THREE.Quaternion(pose.transform.orientation.x, pose.transform.orientation.y, pose.transform.orientation.z, pose.transform.orientation.w));
                    } else {
                        reticle.visible = false;
                    }
                }
                
                renderer.render(scene, camera);
            });
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Запрет зума
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
        
        init();
    </script>
</body>
</html>
