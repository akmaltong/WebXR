<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BurgerAR - Ваш бургер в AR</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
        }

        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        /* Кнопка AR */
        #ar-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #333;
            border: 1px solid rgba(0, 0, 0, 0.1);
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
            white-space: nowrap;
        }

        /* HIDDEN ELEMENTS */
        .burger-title,
        .price,
        .hint,
        #instructions,
        .scan-text,
        #p-title,
        #p-sub,
        .sub {
            display: none !important;
        }

        /* Сканер поверхности (Visual Only) */
        #scanner {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            pointer-events: none;
            z-index: 99999;
            display: none;
        }

        #scanner.active {
            display: block;
        }

        .scan-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #00ff00;
            border-radius: 50%;
            animation: scan-pulse 1.2s infinite;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8), inset 0 0 30px rgba(0, 255, 0, 0.3);
        }

        @keyframes scan-pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        /* Прицел размещения */
        #target {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            pointer-events: none;
            z-index: 99999;
            display: none;
        }

        #target.active {
            display: block;
        }

        .target-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #ff0000;
            border-radius: 50%;
            animation: target-pulse 0.8s infinite;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .target-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff0000;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 0, 0, 1);
            animation: dot-pulse 0.8s infinite;
        }

        @keyframes target-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        @keyframes dot-pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        /* Prompt container (Visual only) */
        #prompt {
            position: fixed;
            left: 50%;
            top: 15%;
            transform: translateX(-50%);
            /* background: rgba(0, 0, 0, 0.9); */
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 99998;
            /* border: 3px solid; */
            min-width: 280px;
            display: none;
        }

        #prompt.scan {
            display: block;
            /* border-color: #00ff00; */
        }

        #prompt.place {
            display: block;
            /* border-color: #ff0000; */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <!-- Scale set to 4 4 4 for visibility in 3D -->
        <model-viewer id="model" src="Hamburger2.glb" ios-src="Hamburger.usdz" alt="Бургер" camera-controls
            touch-action="pan-y" shadow-intensity="1" shadow-softness="0.5" exposure="1" camera-orbit="0deg 75deg 3m"
            min-camera-orbit="auto auto 1.5m" max-camera-orbit="auto auto 10m" scale="4 4 4" ar
            ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor" auto-rotate loading="lazy">

            <button slot="ar-button" id="ar-btn">
                <span>📱</span>
                <span>AR</span>
            </button>
        </model-viewer>
    </div>

    <!-- Сканер -->
    <div id="scanner">
        <div class="scan-ring"></div>
    </div>

    <!-- Прицел -->
    <div id="target">
        <div class="target-ring"></div>
        <div class="target-dot"></div>
    </div>

    <!-- Подсказка -->
    <div id="prompt">
    </div>

    <script>
        const modelViewer = document.getElementById('model');
        const scanner = document.getElementById('scanner');
        const target = document.getElementById('target');
        const prompt = document.getElementById('prompt');

        let arActive = false;
        let surfaceScanned = false;
        let modelPlaced = false;
        let lastTap = 0;
        let arButton = null;

        // Загрузка модели
        modelViewer.addEventListener('load', () => {
            console.log('✅ Модель загружена');
        });

        // AR статус
        modelViewer.addEventListener('ar-status', (e) => {
            console.log('AR:', e.detail.status);

            if (e.detail.status === 'session-started') {
                arActive = true;
                surfaceScanned = false;
                modelPlaced = false;

                // В AR делаем масштаб меньше и комфортнее (0.5), чем в 3D (4)
                // Так как ar-scale="auto", пользователь МОЖЕТ изменить размер щипком
                modelViewer.scale = '0.5 0.5 0.5';

                // Показываем UI размещения
                setTimeout(showPlacementUI, 100);

            } else if (e.detail.status === 'not-presenting') {
                arActive = false;
                hideAllUI();
                // Возвращаем масштаб для 3D режима
                modelViewer.scale = '4 4 4';
            } else if (e.detail.status === 'object-placed') {
                // Default
            }
        });

        // Обработка события обнаружения поверхности
        modelViewer.addEventListener('ar-tracking', (e) => {
            if (!arActive) return;

            const status = e.detail.status;
            console.log('Tracking:', status);

            if (status === 'tracking') {
                // Поверхность найдена - показываем что можно размещать
                if (!surfaceScanned) {
                    surfaceScanned = true;
                    showReadyToPlaceUI();
                }
            } else if (status === 'not-tracking') {
                // Потеряли поверхность
                surfaceScanned = false;
                showScanUI();
            }
        });

        function showPlacementUI() {
            // Показываем начальный UI
            scanner.classList.add('active');
            prompt.classList.add('scan');
            prompt.classList.remove('place');
            target.classList.remove('active');
        }

        function showScanUI() {
            scanner.classList.add('active');
            prompt.classList.add('scan');
            prompt.classList.remove('place');
            target.classList.remove('active');
        }

        function showReadyToPlaceUI() {
            scanner.classList.remove('active');
            target.classList.add('active');
            prompt.classList.remove('scan');
            prompt.classList.add('place');
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            // Показываем кнопку размещения
            showPlaceButton();
        }

        function showPlaceButton() {
            // Создаем или показываем кнопку размещения
            let placeBtn = document.getElementById('place-btn');
            if (!placeBtn) {
                placeBtn = document.createElement('button');
                placeBtn.id = 'place-btn';
                placeBtn.innerHTML = '<span>🍔</span>';
                placeBtn.style.cssText = `
                    position: fixed;
                    bottom: 120px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
                    color: white;
                    border: none;
                    padding: 18px 32px;
                    border-radius: 30px;
                    font-size: 17px;
                    font-weight: 600;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
                    z-index: 999999;
                    animation: fadeIn 0.3s ease;
                `;
                placeBtn.addEventListener('click', placeModel);
                document.body.appendChild(placeBtn);
            }
            placeBtn.style.display = 'flex';
        }

        function hidePlaceButton() {
            const placeBtn = document.getElementById('place-btn');
            if (placeBtn) placeBtn.style.display = 'none';
        }

        function placeModel() {
            if (modelPlaced) return;

            modelPlaced = true;
            // Здесь мы НЕ меняем scale, чтобы остался тот, который мы задали при входе (0.5), или который настроил пользователь

            // Скрываем UI размещения
            hidePlaceButton();
            scanner.classList.remove('active');
            target.classList.remove('active');
            prompt.classList.remove('scan', 'place');

            // Меняем на UI управления
            showControlsUI();

            if (navigator.vibrate) navigator.vibrate(50);
            console.log('✅ Модель размещена');
        }

        function showControlsUI() {
            // Показываем кнопку сброса
            let resetBtn = document.getElementById('reset-btn');
            if (!resetBtn) {
                resetBtn = document.createElement('button');
                resetBtn.id = 'reset-btn';
                resetBtn.innerHTML = '<span>↺</span>';
                resetBtn.style.cssText = `
                    position: fixed;
                    bottom: 40px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: rgba(0, 0, 0, 0.1);
                    color: #333;
                    border: 2px solid #333;
                    padding: 12px 24px;
                    border-radius: 25px;
                    font-size: 15px;
                    font-weight: 600;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    z-index: 999999;
                    backdrop-filter: blur(10px);
                `;
                resetBtn.addEventListener('click', resetPlacement);
                document.body.appendChild(resetBtn);
            }
            resetBtn.style.display = 'flex';

            // Показываем подсказку
            prompt.classList.add('place');
            prompt.style.display = 'block';

            // Скрываем подсказку через 3 секунды
            setTimeout(() => {
                if (modelPlaced) {
                    prompt.style.display = 'none';
                }
            }, 3000);
        }

        function hideControlsUI() {
            const resetBtn = document.getElementById('reset-btn');
            if (resetBtn) resetBtn.style.display = 'none';
        }

        function resetPlacement() {
            modelPlaced = false;
            surfaceScanned = false;
            // При сбросе возвращаем комфортный размер для AR
            modelViewer.scale = '0.5 0.5 0.5';
            hideControlsUI();
            showPlacementUI();
        }

        function hideAllUI() {
            scanner.classList.remove('active');
            target.classList.remove('active');
            prompt.classList.remove('scan', 'place');
            prompt.style.display = 'none';
            hidePlaceButton();
            hideControlsUI();
        }

        // Двойной тап как альтернатива кнопке
        document.addEventListener('touchstart', handleTouch, { passive: false });
        document.addEventListener('click', handleTouch);

        function handleTouch(e) {
            if (!arActive) return;
            if (e.type === 'touchstart') e.preventDefault();

            // Игнорируем касания по кнопкам
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

            const now = Date.now();
            const diff = now - lastTap;

            if (diff < 300 && diff > 0) {
                // Двойной тап - размещаем если поверхность найдена
                if (surfaceScanned && !modelPlaced) {
                    placeModel();
                }
                lastTap = 0;
            } else {
                lastTap = now;
            }
        }

        // Проверка AR
        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (!supported) {
                    const btn = document.getElementById('ar-btn');
                    if (btn) {
                        btn.textContent = 'AR N/A';
                        btn.disabled = true;
                    }
                }
            });
        }

        // Запрет зума
        document.addEventListener('gesturestart', e => e.preventDefault());
    </script>
</body>

</html>
