<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BurgerAR - Ручное размещение</title>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }
        
        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            --poster-color: transparent;
        }
        
        /* Кнопка AR */
        #ar-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(238, 90, 111, 0.4);
            z-index: 10;
            white-space: nowrap;
        }
        
        /* Сканер - зеленый */
        #scanner {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            pointer-events: none;
            display: none;
            z-index: 99999;
        }
        
        #scanner.active {
            display: block;
        }
        
        .scanner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #00ff00;
            border-radius: 50%;
            animation: scanPulse 1s infinite;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.6), inset 0 0 30px rgba(0, 255, 0, 0.2);
        }
        
        .scanner-grid {
            position: absolute;
            left: 10%;
            top: 10%;
            width: 80%;
            height: 80%;
            background-image: 
                radial-gradient(circle, #00ff00 2px, transparent 2px);
            background-size: 20px 20px;
            animation: gridMove 2s linear infinite;
            opacity: 0.6;
        }
        
        @keyframes scanPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }
        
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 20px 20px; }
        }
        
        /* Прицел - красный */
        #cursor {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            pointer-events: none;
            display: none;
            z-index: 99999;
        }
        
        #cursor.active {
            display: block;
        }
        
        .cursor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #ff0000;
            border-radius: 50%;
            animation: cursorPulse 0.8s infinite;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .cursor-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff0000;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 0, 0, 1);
            animation: dotPulse 0.8s infinite;
        }
        
        @keyframes cursorPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.5); }
        }
        
        /* Подсказка */
        #prompt {
            position: fixed;
            left: 50%;
            top: 15%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 99998;
            border: 3px solid #ff6b6b;
            min-width: 280px;
        }
        
        #prompt.scanning {
            border-color: #00ff00;
            display: block;
        }
        
        #prompt.placement {
            border-color: #ff0000;
            display: block;
        }
        
        #prompt p {
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        
        #prompt .sub {
            color: #aaa;
            font-size: 14px;
            margin-top: 8px;
        }
        
        /* Инструкция */
        #instructions {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }
        
        .instr-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            border: 3px solid #ff6b6b;
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
        
        .instr-content h2 {
            color: #ff6b6b;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: white;
            font-size: 15px;
            text-align: left;
        }
        
        .step-num {
            width: 28px;
            height: 28px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }
        
        #start-ar {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        
        /* UI поверх */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        
        .burger-title {
            color: white;
        }
        
        .burger-title h1 {
            font-size: 24px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .price {
            font-size: 20px;
            color: #feca57;
            font-weight: 600;
        }
        
        /* Отладка */
        #debug {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 10px;
            max-width: 250px;
            z-index: 100001;
            max-height: 150px;
            overflow-y: auto;
        }
        
        /* Скрыть model-viewer пока не загрузится */
        model-viewer:not(:defined) {
            display: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <model-viewer
            id="model"
            src="Hamburger2.glb"
            ios-src="Hamburger.usdz"
            alt="Бургер"
            camera-controls
            touch-action="pan-y"
            shadow-intensity="1"
            shadow-softness="0.5"
            exposure="1"
            camera-orbit="0deg 75deg 3m"
            min-camera-orbit="auto auto 3m"
            max-camera-orbit="auto auto 10m"
            scale="0.001 0.001 0.001"
            ar
            ar-modes="webxr"
            ar-scale="fixed"
            ar-placement="floor"
            style="--model-viewer-default-scale: 0.001 0.001 0.001;"
            reveal="interaction">
            
            <div slot="poster" class="ui-overlay">
                <div class="burger-title">
                    <h1>Бургер Классический</h1>
                    <div class="price">450 ₽</div>
                </div>
            </div>
            
            <button slot="ar-button" id="ar-button">
                <span>📱</span>
                <span>Включить AR</span>
            </button>
        </model-viewer>
    </div>
    
    <!-- Сканер поверхности -->
    <div id="scanner">
        <div class="scanner-ring"></div>
        <div class="scanner-grid"></div>
    </div>
    
    <!-- Прицел размещения -->
    <div id="cursor">
        <div class="cursor-ring"></div>
        <div class="cursor-dot"></div>
    </div>
    
    <!-- Подсказка -->
    <div id="prompt">
        <p id="prompt-title">Сканирование поверхности</p>
        <p class="sub" id="prompt-sub">Двойной тап чтобы зафиксировать</p>
    </div>
    
    <!-- Инструкция -->
    <div id="instructions">
        <div class="instr-content">
            <h2>📱 Как использовать AR</h2>
            <div class="step">
                <span class="step-num">1</span>
                <span>Нажмите кнопку AR внизу</span>
            </div>
            <div class="step">
                <span class="step-num">2</span>
                <span>Наведите телефон на стол/пол</span>
            </div>
            <div class="step">
                <span class="step-num">3</span>
                <span>Двойной тап → сканирование</span>
            </div>
            <div class="step">
                <span class="step-num">4</span>
                <span>Еще двойной тап → бургер!</span>
            </div>
            <button id="start-ar">Понятно!</button>
        </div>
    </div>
    
    <!-- Отладка -->
    <div id="debug"></div>

    <script>
        const modelViewer = document.getElementById('model');
        const scanner = document.getElementById('scanner');
        const cursor = document.getElementById('cursor');
        const prompt = document.getElementById('prompt');
        const promptTitle = document.getElementById('prompt-title');
        const promptSub = document.getElementById('prompt-sub');
        const instructions = document.getElementById('instructions');
        const startArBtn = document.getElementById('start-ar');
        const debug = document.getElementById('debug');
        
        let arActive = false;
        let surfaceFound = false;
        let modelPlaced = false;
        let lastTap = 0;
        
        function log(msg) {
            console.log(msg);
            debug.innerHTML += msg + '<br>';
            debug.scrollTop = debug.scrollHeight;
        }
        
        log('🚀 Старт...');
        
        // Закрыть инструкцию и запустить AR
        startArBtn.addEventListener('click', () => {
            instructions.style.display = 'none';
            // Активируем AR кнопку
            modelViewer.activateAR();
        });
        
        // Статус AR
        modelViewer.addEventListener('ar-status', (e) => {
            log('📱 AR: ' + e.detail.status);
            
            if (e.detail.status === 'session-started') {
                arActive = true;
                surfaceFound = false;
                modelPlaced = false;
                
                // Скрываем модель
                modelViewer.scale = '0.001 0.001 0.001';
                
                // Показываем сканер
                showScanner();
                
            } else if (e.detail.status === 'not-presenting') {
                arActive = false;
                hideAllUI();
                modelViewer.scale = '8 8 8';
            }
        });
        
        function showScanner() {
            log('🔍 Показываю сканер');
            scanner.classList.add('active');
            prompt.classList.add('scanning');
            prompt.classList.remove('placement');
            promptTitle.textContent = '🔍 Сканирование поверхности';
            promptSub.textContent = 'Двойной тап чтобы зафиксировать';
            cursor.classList.remove('active');
        }
        
        function showCursor() {
            log('🎯 Показываю прицел');
            scanner.classList.remove('active');
            cursor.classList.add('active');
            prompt.classList.remove('scanning');
            prompt.classList.add('placement');
            promptTitle.textContent = '🍔 Готово!';
            promptSub.textContent = 'Двойной тап чтобы разместить бургер';
            
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
        
        function placeModel() {
            log('🍔 Размещаю модель');
            modelPlaced = true;
            
            // Показываем модель
            modelViewer.scale = '8 8 8';
            
            // Скрываем UI
            scanner.classList.remove('active');
            cursor.classList.remove('active');
            prompt.style.display = 'none';
            
            if (navigator.vibrate) navigator.vibrate(50);
        }
        
        function hideAllUI() {
            scanner.classList.remove('active');
            cursor.classList.remove('active');
            prompt.style.display = 'none';
            prompt.classList.remove('scanning', 'placement');
        }
        
        // Обработка двойного тапа
        document.addEventListener('touchstart', handleTouch, { passive: false });
        document.addEventListener('click', handleTouch);
        
        function handleTouch(e) {
            if (!arActive) return;
            
            if (e.type === 'touchstart') {
                e.preventDefault();
            }
            
            const now = Date.now();
            const diff = now - lastTap;
            
            if (diff < 300 && diff > 0) {
                // Двойной тап
                log('👆👆 Двойной тап');
                
                if (!surfaceFound) {
                    surfaceFound = true;
                    showCursor();
                } else if (!modelPlaced) {
                    placeModel();
                }
                
                lastTap = 0;
            } else {
                lastTap = now;
            }
        }
        
        // Загрузка модели
        modelViewer.addEventListener('load', () => {
            log('✅ Модель загружена');
            modelViewer.scale = '8 8 8';
        });
        
        // Проверка AR
        if ('xr' in navigator) {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (!supported) {
                    log('❌ AR не поддерживается');
                    startArBtn.textContent = 'AR недоступен';
                    startArBtn.disabled = true;
                } else {
                    log('✅ AR поддерживается');
                }
            });
        } else {
            log('❌ WebXR недоступен');
            startArBtn.textContent = 'AR недоступен';
            startArBtn.disabled = true;
        }
        
        // Запрещаем зум
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
    </script>
</body>
</html>
