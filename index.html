<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="BurgerAR - просмотр бургера в 3D и дополненной реальности">
    <title>BurgerAR - Ваш бургер</title>
    
    <!-- Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }
        
        #viewer-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            --poster-color: transparent;
        }
        
        /* Кнопка AR */
        #ar-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(238, 90, 111, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }
        
        #ar-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 12px 35px rgba(238, 90, 111, 0.5);
        }
        
        #ar-button:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .ar-icon {
            font-size: 22px;
        }
        
        /* Прицел AR - большой и заметный */
        #ar-cursor {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            pointer-events: none;
            display: none;
            z-index: 9999;
        }
        
        model-viewer[ar-status="session-started"] > #ar-cursor {
            display: block;
        }
        
        .cursor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: cursorPulse 1s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
        }
        
        .cursor-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff6b6b;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(255, 107, 107, 1);
            animation: dotPulse 1s infinite ease-in-out;
        }
        
        @keyframes cursorPulse {
            0% { transform: scale(1); opacity: 1; border-width: 4px; }
            50% { transform: scale(1.3); opacity: 0.6; border-width: 2px; }
            100% { transform: scale(1); opacity: 1; border-width: 4px; }
        }
        
        @keyframes dotPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.5); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Подсказка AR */
        #ar-prompt {
            position: absolute;
            left: 50%;
            top: 30%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
            border: 2px solid #ff6b6b;
            max-width: 320px;
            width: 90%;
            z-index: 100;
        }
        
        model-viewer[ar-status="session-started"] > #ar-prompt {
            display: block;
        }
        
        .tap-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
        }
        
        .tap-icon svg {
            width: 100%;
            height: 100%;
        }
        
        #ar-prompt p {
            color: #fff;
            font-size: 20px;
            line-height: 1.5;
            margin: 0;
            font-weight: 600;
        }
        
        #ar-prompt .hint-subtitle {
            color: #ff6b6b;
            font-size: 16px;
            margin-top: 10px;
            font-weight: 500;
        }
        
        /* Ошибка AR */
        #ar-error {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 107, 107, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            max-width: 320px;
            width: 90%;
            z-index: 100;
        }
        
        #ar-error p {
            color: white;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        #ar-error button {
            background: white;
            color: #ff6b6b;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
        }
        
        /* Загрузка */
        #loading {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            z-index: 50;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        #loading p {
            color: white;
            font-size: 16px;
        }
        
        /* Верхняя панель */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        
        .burger-info {
            color: white;
            pointer-events: auto;
        }
        
        .burger-info h1 {
            font-size: 26px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .burger-info .price {
            font-size: 22px;
            font-weight: 600;
            color: #feca57;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 20px;
            white-space: nowrap;
        }
        
        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Мобильная адаптация */
        @media (max-width: 480px) {
            .burger-info h1 {
                font-size: 22px;
            }
            
            .burger-info .price {
                font-size: 18px;
            }
            
            #ar-button {
                padding: 16px 28px;
                font-size: 16px;
                bottom: 30px;
            }
            
            .controls-hint {
                font-size: 12px;
                padding: 8px 12px;
            }
            
            #ar-cursor {
                width: 60px;
                height: 60px;
            }
        }
        
        /* Скрытие слотов когда не определены */
        :not(:defined) > * {
            display: none;
        }
        
        /* Отладочная информация */
        #debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-width: 300px;
            z-index: 1000;
            display: none;
        }
        
        #debug-info.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <model-viewer
            id="burger-model"
            src="Hamburger2.glb"
            ios-src="Hamburger.usdz"
            alt="3D модель бургера"
            shadow-intensity="1.1"
            shadow-softness="0.5"
            tone-mapping="aces"
            camera-controls
            touch-action="pan-y"
            ar
            ar-modes="webxr"
            ar-scale="fixed"
            scale="20 20 20"
            xr-environment
            camera-orbit="0deg 75deg 3m"
            min-camera-orbit="auto auto 2m"
            max-camera-orbit="auto auto 8m"
            field-of-view="45deg"
            exposure="1"
            environment-image="neutral"
            auto-rotate="false"
            interaction-prompt="none"
            loading="eager"
            reveal="auto">
            
            <!-- Верхняя панель с информацией -->
            <div slot="poster" class="top-bar">
                <div class="burger-info">
                    <h1>Бургер Классический</h1>
                    <div class="price">450 ₽</div>
                </div>
            </div>
            
            <!-- Подсказка управления -->
            <div slot="poster" class="controls-hint">
                👆 Вращайте • 🤏 Приближайте
            </div>
            
            <!-- Кнопка AR -->
            <button slot="ar-button" id="ar-button">
                <span class="ar-icon">📱</span>
                <span>Включить AR</span>
            </button>
            
            <!-- Прицел для AR - пульсирующий -->
            <div id="ar-cursor" slot="poster">
                <div class="cursor-ring"></div>
                <div class="cursor-dot"></div>
            </div>
            
            <!-- Подсказка для AR -->
            <div id="ar-prompt" slot="poster">
                <div class="tap-icon">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="45" stroke="white" stroke-width="3" fill="rgba(255,255,255,0.1)"/>
                        <circle cx="50" cy="50" r="35" stroke="#ff6b6b" stroke-width="4" fill="none" opacity="0.9">
                            <animate attributeName="r" values="30;40;30" dur="1s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
                        </circle>
                        <text x="50" y="55" text-anchor="middle" fill="white" font-size="30" font-weight="bold">👆</text>
                    </svg>
                </div>
                <p>Наведите на стол</p>
                <p class="hint-subtitle">⚡ Нажмите на экран ⚡</p>
            </div>
            
            <!-- Ошибка AR -->
            <div id="ar-error" slot="poster">
                <p>😕 AR временно недоступен</p>
                <button onclick="retryAR()">Попробовать снова</button>
            </div>
            
            <!-- Индикатор загрузки -->
            <div id="loading" slot="poster">
                <div class="spinner"></div>
                <p>Загрузка 3D модели...<br><small>Это может занять несколько секунд</small></p>
            </div>
        </model-viewer>
    </div>
    
    <!-- Отладочная информация -->
    <div id="debug-info"></div>

    <script>
        const modelViewer = document.getElementById('burger-model');
        const loading = document.getElementById('loading');
        const arError = document.getElementById('ar-error');
        const debugInfo = document.getElementById('debug-info');
        
        // Включаем отладку
        function log(message) {
            console.log(message);
            if (debugInfo) {
                debugInfo.innerHTML += message + '<br>';
                debugInfo.classList.add('visible');
            }
        }
        
        // Инфо об устройстве
        log('📱 ' + navigator.userAgent.substring(0, 40));
        
        // Установка большого масштаба при загрузке
        modelViewer.addEventListener('load', () => {
            log('✅ Модель загружена');
            if (loading) loading.style.display = 'none';
            
            // Масштабируем модель в 20 раз для 3D режима
            try {
                modelViewer.scale = '20 20 20';
                log('📐 Масштаб 20x установлен');
            } catch(e) {
                log('⚠️ Ошибка масштаба: ' + e.message);
            }
        });
        
        // Обработка ошибки загрузки
        modelViewer.addEventListener('error', (e) => {
            log('❌ Ошибка: ' + e.detail);
            if (loading) {
                loading.innerHTML = '<p style="color: #ff6b6b;">😕 Ошибка загрузки</p>';
            }
        });
        
        // Управление AR - ожидание клика
        let arSessionActive = false;
        let modelPlaced = false;
        
        modelViewer.addEventListener('ar-status', (e) => {
            log('📱 AR: ' + e.detail.status);
            
            if (e.detail.status === 'session-started') {
                arSessionActive = true;
                modelPlaced = false;
                log('👆 Ждем клик для размещения...');
                
                // Показываем прицел и подсказку
                const cursor = document.getElementById('ar-cursor');
                const prompt = document.getElementById('ar-prompt');
                if (cursor) cursor.style.display = 'block';
                if (prompt) prompt.style.display = 'block';
                
            } else if (e.detail.status === 'not-presenting') {
                arSessionActive = false;
                modelPlaced = false;
                arError.style.display = 'none';
                
            } else if (e.detail.status === 'failed') {
                log('❌ AR ошибка');
                arError.style.display = 'block';
            }
        });
        
        // Обработка клика для размещения модели
        document.addEventListener('click', (e) => {
            if (!arSessionActive || modelPlaced) return;
            
            // Проверяем, что клик не по кнопкам
            if (e.target.closest('button') || e.target.closest('#ar-prompt')) return;
            
            modelPlaced = true;
            log('✅ Бургер размещен по клику!');
            
            // Скрываем прицел и подсказку
            const cursor = document.getElementById('ar-cursor');
            const prompt = document.getElementById('ar-prompt');
            if (cursor) cursor.style.display = 'none';
            if (prompt) prompt.style.display = 'none';
            
            // Вибрация
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        });
        
        // Также обрабатываем touch для мобильных
        document.addEventListener('touchstart', (e) => {
            if (!arSessionActive || modelPlaced) return;
            
            // Проверяем, что клик не по кнопкам
            if (e.target.closest('button') || e.target.closest('#ar-prompt')) return;
            
            modelPlaced = true;
            log('✅ Бургер размещен по touch!');
            
            const cursor = document.getElementById('ar-cursor');
            const prompt = document.getElementById('ar-prompt');
            if (cursor) cursor.style.display = 'none';
            if (prompt) prompt.style.display = 'none';
            
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }, {passive: true});
        
        // Проверка поддержки AR
        async function checkAR() {
            log('🔍 Проверка AR...');
            
            if ('xr' in navigator) {
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (supported) {
                        log('🥽 WebXR AR доступен');
                        return true;
                    }
                } catch (e) {
                    log('⚠️ WebXR ошибка: ' + e.message);
                }
            }
            
            log('❌ AR не поддерживается');
            return false;
        }
        
        // Повторная попытка AR
        function retryAR() {
            arError.style.display = 'none';
            location.reload();
        }
        
        // Проверяем при загрузке
        checkAR().then(supported => {
            const arButton = document.getElementById('ar-button');
            
            if (!supported && arButton) {
                arButton.innerHTML = '<span class="ar-icon">📵</span><span>AR недоступен</span>';
                arButton.style.background = '#666';
                arButton.style.opacity = '0.7';
                arButton.disabled = true;
                log('📵 Нужен Chrome 83+');
            }
        });
        
        // Защита от зума
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
        document.addEventListener('gestureend', (e) => e.preventDefault());
    </script>
</body>
</html>
