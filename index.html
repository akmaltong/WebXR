<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="BurgerAR - просмотр бургера в 3D и дополненной реальности">
    <title>BurgerAR - Ваш бургер</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }
        
        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* Кнопка AR */
        #ar-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(238, 90, 111, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }
        
        #ar-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 12px 35px rgba(238, 90, 111, 0.5);
        }
        
        #ar-button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .ar-icon {
            font-size: 22px;
        }
        
        /* Сканер поверхности */
        #surface-scanner {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            pointer-events: none;
            display: none;
            z-index: 999999;
        }
        
        #surface-scanner.visible {
            display: block;
        }
        
        .scanner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid #00ff00;
            border-radius: 50%;
            animation: scannerPulse 1.5s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8), inset 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .scanner-dots {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
        }
        
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            animation: dotPulse 1s infinite ease-in-out;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }
        
        .dot:nth-child(1) { left: 20%; top: 20%; animation-delay: 0s; }
        .dot:nth-child(2) { left: 50%; top: 10%; animation-delay: 0.1s; }
        .dot:nth-child(3) { left: 80%; top: 20%; animation-delay: 0.2s; }
        .dot:nth-child(4) { left: 10%; top: 50%; animation-delay: 0.3s; }
        .dot:nth-child(5) { left: 50%; top: 50%; animation-delay: 0.4s; }
        .dot:nth-child(6) { left: 90%; top: 50%; animation-delay: 0.5s; }
        .dot:nth-child(7) { left: 20%; top: 80%; animation-delay: 0.6s; }
        .dot:nth-child(8) { left: 50%; top: 90%; animation-delay: 0.7s; }
        .dot:nth-child(9) { left: 80%; top: 80%; animation-delay: 0.8s; }
        
        @keyframes scannerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
        }
        
        /* Прицел размещения */
        #placement-cursor {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            pointer-events: none;
            display: none;
            z-index: 999999;
        }
        
        #placement-cursor.visible {
            display: block;
        }
        
        .placement-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid #ff0000;
            border-radius: 50%;
            animation: placementPulse 0.8s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .placement-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff0000;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 0, 0, 1);
            animation: placementDotPulse 0.8s infinite ease-in-out;
        }
        
        @keyframes placementPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes placementDotPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.8); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Подсказки */
        #ar-prompt {
            position: fixed;
            left: 50%;
            top: 20%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            border: 2px solid #ff6b6b;
            max-width: 300px;
            width: 90%;
            z-index: 999998;
        }
        
        #ar-prompt.visible {
            display: block;
        }
        
        #ar-prompt.scanning {
            border-color: #00ff00;
        }
        
        #ar-prompt.placement {
            border-color: #ff0000;
        }
        
        #ar-prompt p {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }
        
        #ar-prompt .hint-subtitle {
            color: #aaa;
            font-size: 14px;
            margin-top: 8px;
            font-weight: 400;
        }
        
        /* Инструкция */
        #ar-instructions {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999999;
        }
        
        .instruction-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            border: 3px solid #ff6b6b;
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
        }
        
        .instruction-content h2 {
            color: #ff6b6b;
            font-size: 24px;
            margin-bottom: 25px;
        }
        
        .instruction-steps {
            text-align: left;
            margin-bottom: 25px;
        }
        
        .step {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            color: white;
            font-size: 16px;
        }
        
        .step-num {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        #close-instructions {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Загрузка */
        #loading {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 50;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        #loading p {
            color: white;
            font-size: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* UI Overlay для 3D */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        
        .burger-info {
            color: white;
        }
        
        .burger-info h1 {
            font-size: 26px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .burger-info .price {
            font-size: 22px;
            font-weight: 600;
            color: #feca57;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 20px;
            white-space: nowrap;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        
        <!-- UI Overlay -->
        <div id="ui-overlay">
            <div class="burger-info">
                <h1>Бургер Классический</h1>
                <div class="price">450 ₽</div>
            </div>
        </div>
        
        <div class="controls-hint">
            👆 Вращайте • 🤏 Приближайте
        </div>
        
        <button id="ar-button">
            <span class="ar-icon">📱</span>
            <span>Включить AR</span>
        </button>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Загрузка 3D модели...</p>
        </div>
    </div>
    
    <!-- Сканер поверхности (зеленые точки) -->
    <div id="surface-scanner">
        <div class="scanner-ring"></div>
        <div class="scanner-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    
    <!-- Прицел размещения (красный) -->
    <div id="placement-cursor">
        <div class="placement-ring"></div>
        <div class="placement-dot"></div>
    </div>
    
    <!-- Подсказка -->
    <div id="ar-prompt">
        <p id="prompt-title">Сканирование поверхности</p>
        <p class="hint-subtitle" id="prompt-subtitle">Двойной тап чтобы зафиксировать</p>
    </div>
    
    <!-- Инструкция -->
    <div id="ar-instructions">
        <div class="instruction-content">
            <h2>📱 Как использовать AR</h2>
            <div class="instruction-steps">
                <div class="step">
                    <span class="step-num">1</span>
                    <span class="step-text">Нажмите кнопку AR</span>
                </div>
                <div class="step">
                    <span class="step-num">2</span>
                    <span class="step-text">Наведите на поверхность</span>
                </div>
                <div class="step">
                    <span class="step-num">3</span>
                    <span class="step-text">Двойной тап → сканирование</span>
                </div>
                <div class="step">
                    <span class="step-num">4</span>
                    <span class="step-text">Еще двойной тап → бургер!</span>
                </div>
            </div>
            <button id="close-instructions">Понятно!</button>
        </div>
    </div>
    
    <!-- Отладка -->
    <div id="debug-info" style="position: fixed; bottom: 10px; left: 10px; background: rgba(0,0,0,0.9); color: #0f0; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 11px; max-width: 300px; z-index: 1000000; max-height: 200px; overflow-y: auto;"></div>

    <script>
        // Глобальные переменные
        let scene, camera, renderer;
        let burgerModel = null;
        let xrSession = null;
        let xrRefSpace = null;
        let hitTestSource = null;
        let reticle = null;
        let isARActive = false;
        let surfaceScanned = false;
        let modelPlaced = false;
        let lastTapTime = 0;
        
        // DOM элементы
        const canvas = document.getElementById('canvas');
        const arButton = document.getElementById('ar-button');
        const loading = document.getElementById('loading');
        const surfaceScanner = document.getElementById('surface-scanner');
        const placementCursor = document.getElementById('placement-cursor');
        const arPrompt = document.getElementById('ar-prompt');
        const promptTitle = document.getElementById('prompt-title');
        const promptSubtitle = document.getElementById('prompt-subtitle');
        const arInstructions = document.getElementById('ar-instructions');
        const closeInstructionsBtn = document.getElementById('close-instructions');
        const debugInfo = document.getElementById('debug-info');
        
        // Функция логирования
        function log(msg) {
            console.log(msg);
            if (debugInfo) {
                debugInfo.innerHTML += msg + '<br>';
                debugInfo.scrollTop = debugInfo.scrollHeight;
            }
        }
        
        // Закрыть инструкцию
        closeInstructionsBtn.addEventListener('click', () => {
            arInstructions.style.display = 'none';
        });
        
        // Инициализация Three.js
        function init() {
            log('🎨 Инициализация Three.js...');
            scene = new THREE.Scene();
            
            // Камера
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.5, 3);
            
            // Рендерер
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            renderer.xr.enabled = true;
            
            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            // Загрузка модели
            loadBurger();
            
            // Создание reticle (визуальный индикатор)
            createReticle();
            
            // Обработчики
            window.addEventListener('resize', onWindowResize);
            arButton.addEventListener('click', startAR);
            
            // Проверка AR
            checkARSupport();
        }
        
        // Создание reticle (плоскость с точками)
        function createReticle() {
            reticle = new THREE.Group();
            
            // Кольцо
            const ringGeometry = new THREE.RingGeometry(0.08, 0.1, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ff00,
                transparent: true,
                opacity: 0.8,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            reticle.add(ring);
            
            // Точки вокруг
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const dotGeometry = new THREE.SphereGeometry(0.015, 8, 8);
                const dotMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0x00ff00,
                    transparent: true,
                    opacity: 0.9
                });
                const dot = new THREE.Mesh(dotGeometry, dotMaterial);
                dot.position.set(Math.cos(angle) * 0.12, 0, Math.sin(angle) * 0.12);
                reticle.add(dot);
            }
            
            reticle.visible = false;
            scene.add(reticle);
        }
        
        // Загрузка бургера
        function loadBurger() {
            loading.style.display = 'block';
            
            const loader = new THREE.GLTFLoader();
            log('📦 Загружаю модель...');
            loader.load('Hamburger2.glb', (gltf) => {
                log('✅ Модель загружена');
                burgerModel = gltf.scene;
                burgerModel.scale.set(8, 8, 8);
                burgerModel.visible = false; // Скрыт до размещения
                
                burgerModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                scene.add(burgerModel);
                loading.style.display = 'none';
                
                // Начинаем обычный рендер
                animate();
            }, undefined, (error) => {
                console.error('Ошибка загрузки:', error);
                loading.innerHTML = '<p style="color: #ff6b6b;">Ошибка загрузки модели</p>';
            });
        }
        
        // Проверка поддержки AR
        async function checkARSupport() {
            if ('xr' in navigator) {
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (!supported) {
                        arButton.innerHTML = '<span class="ar-icon">📵</span><span>AR недоступен</span>';
                        arButton.disabled = true;
                    }
                } catch (e) {
                    arButton.disabled = true;
                }
            } else {
                arButton.disabled = true;
            }
        }
        
        // Запуск AR
        async function startAR() {
            log('🚀 Запуск AR...');
            if (!navigator.xr) {
                log('❌ WebXR не поддерживается');
                return;
            }
            
            try {
                log('📱 Запрашиваю XR сессию...');
                xrSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['dom-overlay'],
                    domOverlay: { root: document.body }
                });
                
                log('✅ XR сессия получена');
                isARActive = true;
                surfaceScanned = false;
                modelPlaced = false;
                
                // Настройка сессии
                xrSession.addEventListener('end', onARSessionEnd);
                
                const baseLayer = new THREE.XRWebGLLayer(xrSession, renderer.getContext());
                xrSession.updateRenderState({ baseLayer });
                
                const refSpace = await xrSession.requestReferenceSpace('local');
                xrRefSpace = refSpace;
                
                // Hit test
                const viewerSpace = await xrSession.requestReferenceSpace('viewer');
                hitTestSource = await xrSession.requestHitTestSource({ space: viewerSpace });
                
                // Скрываем инструкцию
                arInstructions.style.display = 'none';
                
                // Показываем UI сканирования
                log('📱 Показываю UI сканирования...');
                showScanningUI();
                
                // Обработчики тачей
                xrSession.addEventListener('select', onSelect);
                
                renderer.xr.setSession(xrSession);
                log('✅ AR запущен!');
                
            } catch (e) {
                log('❌ AR ошибка: ' + e.message);
                alert('AR не удалось запустить: ' + e.message);
            }
        }
        
        // Показ UI сканирования
        function showScanningUI() {
            log('🔍 Показываю сканер');
            surfaceScanner.style.display = 'block';
            arPrompt.style.display = 'block';
            arPrompt.style.borderColor = '#00ff00';
            promptTitle.textContent = '🔍 Сканирование поверхности';
            promptSubtitle.textContent = 'Двойной тап чтобы зафиксировать';
        }
        
        // Показ UI размещения
        function showPlacementUI() {
            log('🍔 Показываю прицел размещения');
            surfaceScanner.style.display = 'none';
            placementCursor.style.display = 'block';
            arPrompt.style.borderColor = '#ff0000';
            promptTitle.textContent = '🍔 Готово!';
            promptSubtitle.textContent = 'Двойной тап чтобы разместить бургер';
            
            // Вибрация
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
        
        // Обработка выбора (тапа)
        function onSelect(event) {
            log('👆 Тап detected');
            const currentTime = Date.now();
            const tapLength = currentTime - lastTapTime;
            log('⏱️ Tap length: ' + tapLength);
            
            if (tapLength < 300 && tapLength > 0) {
                // Двойной тап
                log('👆👆 ДВОЙНОЙ ТАП!');
                if (!surfaceScanned) {
                    log('✅ Фиксирую поверхность');
                    surfaceScanned = true;
                    showPlacementUI();
                } else if (!modelPlaced && reticle.visible) {
                    log('🍔 Размещаю бургер');
                    placeBurger();
                }
                lastTapTime = 0;
            } else {
                lastTapTime = currentTime;
                log('👆 Первый тап, жду второй...');
            }
        }
        
        // Размещение бургера
        function placeBurger() {
            log('🍔 Размещение бургера...');
            if (!burgerModel) {
                log('❌ Модель не загружена');
                return;
            }
            if (!reticle.visible) {
                log('❌ Reticle не виден');
                return;
            }
            
            modelPlaced = true;
            
            // Копируем позицию reticle
            burgerModel.position.copy(reticle.position);
            burgerModel.rotation.copy(reticle.rotation);
            burgerModel.visible = true;
            
            log('✅ Бургер размещен!');
            
            // Скрываем UI
            placementCursor.style.display = 'none';
            arPrompt.style.display = 'none';
            reticle.visible = false;
            
            // Вибрация
            if (navigator.vibrate) navigator.vibrate(50);
        }
        
        // Окончание AR сессии
        function onARSessionEnd() {
            log('👋 AR сессия завершена');
            isARActive = false;
            surfaceScanned = false;
            modelPlaced = false;
            
            if (burgerModel) {
                burgerModel.visible = false;
            }
            
            surfaceScanner.style.display = 'none';
            placementCursor.style.display = 'none';
            arPrompt.style.display = 'none';
            
            xrSession = null;
            hitTestSource = null;
        }
        
        // Анимация
        function animate() {
            renderer.setAnimationLoop((timestamp, frame) => {
                if (frame && isARActive && hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(xrRefSpace);
                        
                        if (pose) {
                            reticle.visible = true;
                            reticle.position.set(
                                pose.transform.position.x,
                                pose.transform.position.y,
                                pose.transform.position.z
                            );
                            reticle.rotation.set(
                                pose.transform.orientation.x,
                                pose.transform.orientation.y,
                                pose.transform.orientation.z,
                                pose.transform.orientation.w
                            );
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
                
                renderer.render(scene, camera);
            });
        }
        
        // Изменение размера окна
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Запуск
        init();
    </script>
</body>
</html>
