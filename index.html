<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🍔 Burger AR - На столе</title>
    <!-- Подключаем model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            color: #333;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: #ffffff;
        }

        /* Кнопка активации AR */
        .ar-button {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .ar-button:active {
            transform: translateX(-50%) scale(0.95);
        }

        .ar-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        /* Инфо-панель сверху */
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            display: none;
            /* 👈 Скрываем текст */
        }

        /* Скрываем для чистоты, если нужно */
        .info-panel {
            /* display: none; */
        }

        h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        p {
            margin: 5px 0 0;
            opacity: 0.8;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="info-panel">
        <h1 id="dish-name">Загрузка...</h1>
        <p id="dish-details">...</p>
    </div>

    <!-- 3D Модель -->
    <model-viewer id="model-viewer" src="" ios-src="Hamburger.usdz" ar ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor" ar-scale="auto" camera-controls tone-mapping="neutral" shadow-intensity="1" auto-rotate
        rotation-per-second="30deg" interaction-prompt="auto">

        <!-- Кастомная кнопка AR -->
        <button slot="ar-button" class="ar-button">
            <svg class="ar-icon" viewBox="0 0 24 24">
                <path
                    d="M3 3h2v2H3V3m4 0h2v2H7V3m4 0h2v2h-2V3m4 0h2v2h-2V3m4 0h2v2h-2V3M3 7h2v2H3V7m18 0h2v2h-2V7M3 11h2v2H3v-2m18 0h2v2h-2v-2m-9 2l-7 4v4l7 4 7-4v-4l-7-4m0 2.2l5 2.85V18l-5-2.85V15.2m-5.85 2.85l5-2.85v2.85l-5 2.85V18.05M3 15h2v2H3v-2m18 0h2v2h-2v-2M3 19h2v2H3v-2m4 0h2v2H7v-2m4 0h2v2h-2v-2m4 0h2v2h-2v-2m4 0h2v2h-2v-2z" />
            </svg>
            Поставить на стол
        </button>

    </model-viewer>

    <script>
        // 🛠 НАСТРОЙКА МЕНЮ (БАЗА ДАННЫХ)
        const menuDatabase = {
            'classic': {
                name: 'Классический Бургер',
                price: '450 ₽',
                desc: 'Сочная говядина, овощи',
                model: 'Hamburger2.glb'
            },
            'cheese': {
                name: 'Чизбургер Делюкс',
                price: '490 ₽',
                desc: 'Двойной сыр, котлета',
                model: 'burger_cheese.glb'
            }
        };

        // Логика загрузки
        const params = new URLSearchParams(window.location.search);
        const dishId = params.get('id') || 'classic'; // Если нет id, открываем classic
        const dish = menuDatabase[dishId] || menuDatabase['classic'];

        // Обновляем страницу
        document.getElementById('dish-name').textContent = dish.name;
        document.getElementById('dish-details').textContent = `${dish.price} • ${dish.desc}`;

        const mv = document.getElementById('model-viewer');
        mv.src = dish.model;

        // Установка масштаба, если нужно для конкретной модели (опционально)
        // mv.scale = '2 2 2'; 

        console.log(`🍔 Загружен бургер: ${dishId}`);
    </script>

</body>

</html>
