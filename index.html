<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="BurgerAR - просмотр бургера в 3D и дополненной реальности">
    <title>BurgerAR - Ваш бургер</title>
    
    <!-- Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }
        
        #viewer-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            --poster-color: transparent;
        }
        
        /* Кнопка AR */
        #ar-button {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            position: absolute;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(238, 90, 111, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }
        
        #ar-button:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 12px 35px rgba(238, 90, 111, 0.5);
        }
        
        #ar-button:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        .ar-icon {
            font-size: 22px;
        }
        
        /* Прицел AR - ВАЖНО: fixed позиционирование чтобы быть поверх всего */
        #ar-cursor {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            pointer-events: none;
            display: none;
            z-index: 999999;
        }
        
        #ar-cursor.visible {
            display: block !important;
        }
        
        .cursor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px solid #ff0000;
            border-radius: 50%;
            animation: cursorPulse 0.8s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .cursor-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff0000;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(255, 0, 0, 1);
            animation: dotPulse 0.8s infinite ease-in-out;
        }
        
        @keyframes cursorPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes dotPulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.8); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        /* Подсказка AR */
        #ar-prompt {
            position: fixed;
            left: 50%;
            top: 25%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            border: 3px solid #ff0000;
            max-width: 350px;
            width: 90%;
            z-index: 999998;
        }
        
        #ar-prompt.visible {
            display: block !important;
        }
        
        .tap-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }
        
        .tap-icon svg {
            width: 100%;
            height: 100%;
        }
        
        #ar-prompt p {
            color: #fff;
            font-size: 22px;
            line-height: 1.5;
            margin: 0;
            font-weight: 700;
        }
        
        #ar-prompt .hint-subtitle {
            color: #ff0000;
            font-size: 18px;
            margin-top: 15px;
            font-weight: 600;
        }
        
        /* Ошибка AR */
        #ar-error {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 107, 107, 0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            display: none;
            max-width: 320px;
            width: 90%;
            z-index: 999999;
        }
        
        #ar-error p {
            color: white;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        
        #ar-error button {
            background: white;
            color: #ff6b6b;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
        }
        
        /* Загрузка */
        #loading {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 20px;
            z-index: 50;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        #loading p {
            color: white;
            font-size: 16px;
        }
        
        /* Верхняя панель */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
            pointer-events: none;
        }
        
        .burger-info {
            color: white;
            pointer-events: auto;
        }
        
        .burger-info h1 {
            font-size: 26px;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .burger-info .price {
            font-size: 22px;
            font-weight: 600;
            color: #feca57;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 20px;
            white-space: nowrap;
        }
        
        /* Анимации */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Мобильная адаптация */
        @media (max-width: 480px) {
            .burger-info h1 {
                font-size: 22px;
            }
            
            .burger-info .price {
                font-size: 18px;
            }
            
            #ar-button {
                padding: 16px 28px;
                font-size: 16px;
                bottom: 30px;
            }
            
            #ar-cursor {
                width: 80px;
                height: 80px;
            }
            
            #ar-prompt {
                padding: 20px;
            }
            
            #ar-prompt p {
                font-size: 18px;
            }
            
            #ar-prompt .hint-subtitle {
                font-size: 16px;
            }
        }
        
        /* Скрытие слотов когда не определены */
        :not(:defined) > * {
            display: none;
        }
        
        /* Отладочная информация */
        #debug-info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            max-width: 280px;
            z-index: 1000000;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
        
        #debug-info.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div id="viewer-container">
        <model-viewer
            id="burger-model"
            src="Hamburger2.glb"
            ios-src="Hamburger.usdz"
            alt="3D модель бургера"
            shadow-intensity="1.1"
            shadow-softness="0.5"
            tone-mapping="aces"
            camera-controls
            touch-action="pan-y"
            ar
            ar-modes="webxr"
            ar-scale="fixed"
            scale="8 8 8"
            ar-placement="floor"
            xr-environment
            camera-orbit="0deg 75deg 5m"
            min-camera-orbit="auto auto 3m"
            max-camera-orbit="auto auto 10m"
            field-of-view="60deg"
            exposure="1"
            environment-image="neutral"
            auto-rotate="false"
            interaction-prompt="none"
            loading="eager"
            reveal="auto">
            
            <!-- Верхняя панель с информацией -->
            <div slot="poster" class="top-bar">
                <div class="burger-info">
                    <h1>Бургер Классический</h1>
                    <div class="price">450 ₽</div>
                </div>
            </div>
            
            <!-- Подсказка управления -->
            <div slot="poster" class="controls-hint">
                👆 Вращайте • 🤏 Приближайте
            </div>
            
            <!-- Кнопка AR -->
            <button slot="ar-button" id="ar-button">
                <span class="ar-icon">📱</span>
                <span>Включить AR</span>
            </button>
            
            <!-- Индикатор загрузки -->
            <div id="loading" slot="poster">
                <div class="spinner"></div>
                <p>Загрузка 3D модели...<br><small>Это может занять несколько секунд</small></p>
            </div>
        </model-viewer>
    </div>
    
    <!-- Прицел для AR - вне model-viewer для гарантированной видимости -->
    <div id="ar-cursor">
        <div class="cursor-ring"></div>
        <div class="cursor-dot"></div>
    </div>
    
    <!-- Подсказка для AR -->
    <div id="ar-prompt">
        <div class="tap-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="white" stroke-width="3" fill="rgba(255,255,255,0.1)"/>
                <circle cx="50" cy="50" r="35" stroke="#ff0000" stroke-width="5" fill="none">
                    <animate attributeName="r" values="30;45;30" dur="0.8s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
                </circle>
                <circle cx="50" cy="50" r="15" fill="#ff0000">
                    <animate attributeName="r" values="15;20;15" dur="0.8s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>
        <p>👆 НАЖМИТЕ НА ЭКРАН</p>
        <p class="hint-subtitle">Чтобы разместить бургер на столе</p>
    </div>
    
    <!-- Ошибка AR -->
    <div id="ar-error">
        <p>😕 AR временно недоступен</p>
        <button onclick="location.reload()">Попробовать снова</button>
    </div>
    
    <!-- Отладочная информация -->
    <div id="debug-info"></div>

    <script>
        const modelViewer = document.getElementById('burger-model');
        const loading = document.getElementById('loading');
        const arCursor = document.getElementById('ar-cursor');
        const arPrompt = document.getElementById('ar-prompt');
        const arError = document.getElementById('ar-error');
        const debugInfo = document.getElementById('debug-info');
        
        // Отладка
        function log(message) {
            console.log(message);
            if (debugInfo) {
                debugInfo.innerHTML += message + '<br>';
                debugInfo.classList.add('visible');
                // Ограничиваем количество строк
                const lines = debugInfo.innerHTML.split('<br>');
                if (lines.length > 10) {
                    debugInfo.innerHTML = lines.slice(-10).join('<br>');
                }
            }
        }
        
        log('📱 Запуск...');
        
        // Установка масштаба при загрузке
        modelViewer.addEventListener('load', () => {
            log('✅ Модель загружена');
            if (loading) loading.style.display = 'none';
            
            try {
                modelViewer.scale = '8 8 8';
                log('📐 Масштаб 8x');
            } catch(e) {
                log('⚠️ Ошибка масштаба');
            }
        });
        
        // Обработка ошибки
        modelViewer.addEventListener('error', (e) => {
            log('❌ Ошибка загрузки');
            if (loading) {
                loading.innerHTML = '<p style="color: #ff6b6b;">😕 Ошибка загрузки</p>';
            }
        });
        
        // Управление AR
        let arActive = false;
        let modelPlaced = false;
        
        modelViewer.addEventListener('ar-status', (e) => {
            log('📱 AR: ' + e.detail.status);
            
            if (e.detail.status === 'session-started') {
                arActive = true;
                modelPlaced = false;
                
                // Показываем прицел и подсказку
                if (arCursor) arCursor.classList.add('visible');
                if (arPrompt) arPrompt.classList.add('visible');
                
                log('👆 Показан прицел, ждем клик');
                
            } else if (e.detail.status === 'not-presenting') {
                arActive = false;
                modelPlaced = false;
                
                // Скрываем прицел и подсказку
                if (arCursor) arCursor.classList.remove('visible');
                if (arPrompt) arPrompt.classList.remove('visible');
                if (arError) arError.style.display = 'none';
                
            } else if (e.detail.status === 'failed') {
                log('❌ AR ошибка');
                if (arError) arError.style.display = 'block';
                if (arCursor) arCursor.classList.remove('visible');
                if (arPrompt) arPrompt.classList.remove('visible');
            }
        });
        
        // Обработка клика/тача для размещения
        function handlePlace(e) {
            if (!arActive || modelPlaced) return;
            
            // Проверяем, что клик не по кнопке
            if (e.target.closest('button') || e.target.closest('#ar-error')) return;
            
            modelPlaced = true;
            log('✅ Размещено!');
            
            // Скрываем прицел и подсказку
            if (arCursor) arCursor.classList.remove('visible');
            if (arPrompt) arPrompt.classList.remove('visible');
            
            // Вибрация
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        // Слушаем клики и тачи
        document.addEventListener('click', handlePlace);
        document.addEventListener('touchstart', handlePlace, {passive: true});
        
        // Проверка поддержки AR
        async function checkAR() {
            if ('xr' in navigator) {
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    log('🥽 AR поддержка: ' + supported);
                    return supported;
                } catch (e) {
                    log('⚠️ AR ошибка: ' + e.message);
                }
            } else {
                log('❌ WebXR недоступен');
            }
            return false;
        }
        
        // Проверяем при загрузке
        checkAR().then(supported => {
            const arButton = document.getElementById('ar-button');
            if (!supported && arButton) {
                arButton.innerHTML = '<span class="ar-icon">📵</span><span>AR недоступен</span>';
                arButton.style.background = '#666';
                arButton.disabled = true;
                log('📵 Нужен Chrome 83+');
            }
        });
        
        // Защита от зума
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('gesturechange', (e) => e.preventDefault());
    </script>
</body>
</html>
