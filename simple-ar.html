<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍔 BurgerAR - Simple</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        model-viewer {
            width: 100%;
            max-width: 600px;
            height: 500px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        #ar-button {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #ar-button:active {
            transform: scale(0.95);
        }

        .info {
            text-align: center;
            color: white;
            margin-top: 20px;
        }

        .info h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .info p {
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div>
        <model-viewer src="./Hamburger2.glb" ios-src="./Hamburger.usdz" alt="Бургер" ar
            ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" shadow-intensity="1"
            shadow-softness="0.5" exposure="1" camera-orbit="0deg 75deg 2.5m" min-camera-orbit="auto auto 1m"
            max-camera-orbit="auto auto 5m" auto-rotate auto-rotate-delay="1000" rotation-per-second="30deg">

            <button slot="ar-button" id="ar-button">
                <span>📱</span>
                <span>Посмотреть в AR</span>
            </button>

            <div id="ar-prompt" slot="ar-prompt">
                <img src="https://modelviewer.dev/shared-assets/icons/hand.png">
            </div>
        </model-viewer>

        <div class="info">
            <h1>🍔 Классический бургер</h1>
            <p>Вращайте модель • Нажмите AR для просмотра в реальности</p>
        </div>
    </div>
</body>

</html>
